<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kgotla USSD Simulator</title>
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/console.css">
<style>
  .fp{max-width:340px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-radius:28px;padding:20px;display:grid;gap:12px}
  .lcd{background:var(--lcd);color:var(--lcd-ink);border-radius:10px;padding:14px;font:500 14px/1.55 var(--mono);min-height:230px;white-space:pre-wrap;word-break:break-word}
  .keys{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
  .keys button{border:0;background:var(--key);color:var(--key-ink);border-radius:12px;padding:10px 0;font:600 19px var(--mono);cursor:pointer}
  .acts{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
  .acts button{border:0;border-radius:12px;padding:10px 0;font-weight:700;cursor:pointer}
  #in{font:600 18px var(--mono);width:100%}
</style>
</head>
<body>
<header class="top"><span class="mini-flag"><i></i><i></i><i></i><i></i><i></i></span><h1>USSD simulator · *321#</h1></header>
<main style="max-width:720px">
  <p class="hint">This page plays the part of the mobile network's USSD gateway, so you can try the feature-phone menu without a SIM. In production the operator's gateway calls <span class="mono">POST /v1/ussd</span>.</p>
  <div class="fp">
    <div class="field"><label for="phone">Phone number (demo: 71234558 is Naledi, PIN 2580)</label><input id="phone" value="+26771234558" inputmode="tel"></div>
    <div class="lcd" id="lcd" aria-live="polite">Dial *321# and press Call.</div>
    <input id="in" value="*321#" aria-label="Input">
    <div class="keys" id="keys"></div>
    <div class="acts"><button id="call" style="background:var(--good);color:#fff">Call</button><button id="clr" style="background:var(--key);color:var(--key-ink)">Clear</button><button id="end" style="background:var(--crit);color:#fff">End</button></div>
  </div>
</main>
<script src="/ussd.js"></script>
</body>
</html>
